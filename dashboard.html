<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد - قمر ليل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- سەرپەڕەی سەرەکی (Header) -->
    <header class="bg-sky-600 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-lg md:text-xl font-bold">سیستەمی مۆڵەتی کارمەندەکان - قمر ليل</h1>
            <p id="welcomeUserDisplay" class="text-xs text-sky-100 mt-1">بەخێر هاتیت بەڕێپرسی نوسینگە (نەدمین)</p>
        </div>
        <a href="index.html" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> چوونه‌دەرەوە
        </a>
    </header>

    <!-- ناوەڕۆکی داشبورد -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- بەشی زیادکردنی کارمەندی نوێ -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-base font-bold text-slate-800 mb-4 text-center">زیادکردنی کارمەندی نوێ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-emerald-600">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="text" id="newEmpEmail" class="w-full pr-10 pl-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50" placeholder="admin@qamarlil.com">
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-amber-500">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="newEmpPassword" class="w-full pr-10 pl-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50" placeholder="وشەی نهێنی">
                </div>
            </div>
            <button id="addEmpBtn" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-xl transition text-sm cursor-pointer shadow-md shadow-sky-600/10">تۆمارکردن</button>
        </section>

        <!-- بەشی داواکارییە چاوەڕوانکراوەکانی کارمەندان -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-base font-bold text-slate-800 mb-4 text-center">داواکارییە چاوەڕوانکراوەکانی کارمەندان</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-100 text-xs">
                            <th class="pb-3 font-semibold">ناوی کارمەند</th>
                            <th class="pb-3 font-semibold">جۆر</th>
                            <th class="pb-3 font-semibold">ماوە / کات</th>
                            <th class="pb-3 font-semibold">بەڕێوار</th>
                            <th class="pb-3 font-semibold">هۆکار</th>
                            <th class="pb-3 font-semibold text-center">کردارەکان</th>
                        </tr>
                    </thead>
                    <tbody id="leaveRequestsTableBody" class="divide-y divide-slate-50 text-slate-700">
                        <!-- لێرەدا زانیارییەکان بە جافاسکریپت دەردەکەون -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
